name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Laravel project initialization
        id: laravel
        shell: bash
        run: |
          if [ -f "artisan" ] && [ -f "composer.json" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup PHP 8.3
        if: steps.laravel.outputs.ready == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, sqlite3, intl, mbstring, zip, fileinfo
          coverage: none

      - name: Install Composer dependencies
        if: steps.laravel.outputs.ready == 'true'
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare SQLite test environment
        if: steps.laravel.outputs.ready == 'true'
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Run migrations and seeders
        if: steps.laravel.outputs.ready == 'true'
        run: php artisan migrate:fresh --seed --force

      - name: Run Laravel test suite
        if: steps.laravel.outputs.ready == 'true'
        run: php artisan test
